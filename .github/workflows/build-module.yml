name: Build Magisk Module

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "27.2.12479018"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android NDK
        shell: bash
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build native artifacts
        shell: bash
        run: bash scripts/build-native.sh

      - name: Resolve release identity
        shell: bash
        run: |
          # If we were triggered by a tag push, use the tag name verbatim.
          # Otherwise produce a timestamped pre-release identifier.
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            kind="tag"
            prerelease="false"
          else
            ts="$(TZ=Asia/Shanghai date +'%Y%m%d-%H%M%S')"
            tag="nightly-${ts}"
            kind="nightly"
            prerelease="true"
          fi
          echo "RELEASE_TAG=${tag}" >> "$GITHUB_ENV"
          echo "RELEASE_KIND=${kind}" >> "$GITHUB_ENV"
          echo "RELEASE_PRERELEASE=${prerelease}" >> "$GITHUB_ENV"
          echo "ZIP_NAME=scene-netns-isolator-${tag}.zip" >> "$GITHUB_ENV"

      - name: Package module zip
        shell: bash
        run: |
          rm -f "${ZIP_NAME}"
          (cd module && zip -r "../${ZIP_NAME}" .)
          unzip -l "${ZIP_NAME}"

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${RELEASE_KIND}" == "tag" ]]; then
            # The tag already exists in the repo (it's what triggered us).
            # Some tag pushes can race ahead of the API view, so use --target
            # to nail down the exact commit we're building from.
            gh release create "${RELEASE_TAG}" "${ZIP_NAME}" \
              --title "Scene Netns Isolator ${RELEASE_TAG}" \
              --notes "Automated release from ${GITHUB_SHA}." \
              --target "${GITHUB_SHA}" \
              || gh release upload "${RELEASE_TAG}" "${ZIP_NAME}" --clobber
          else
            gh release create "${RELEASE_TAG}" "${ZIP_NAME}" \
              --title "Scene Netns Isolator nightly ${RELEASE_TAG#nightly-}" \
              --notes "Automated nightly build from ${GITHUB_SHA}." \
              --prerelease \
              --latest=false
          fi
